<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>送信完了 | インシデント・アクシデント報告書</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Hiragino Sans', 'Meiryo', sans-serif;
      background: #f5fbf5;
      color: #333;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 32px 16px;
    }
    .card {
      background: white;
      border-radius: 12px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.1);
      padding: 40px 32px;
      text-align: center;
      max-width: 360px;
      width: 100%;
    }
    .icon {
      font-size: 64px;
      margin-bottom: 20px;
    }
    h1 {
      font-size: 22px;
      color: #5aaa5f;
      margin-bottom: 12px;
    }
    p {
      font-size: 14px;
      color: #666;
      line-height: 1.7;
      margin-bottom: 8px;
    }
    .back-btn {
      display: inline-block;
      margin-top: 28px;
      padding: 14px 32px;
      background: #5aaa5f;
      color: white;
      text-decoration: none;
      border-radius: 8px;
      font-size: 15px;
      font-family: inherit;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">✅</div>
    <h1>送信しました</h1>
    <p>インシデント・アクシデント報告書を受け付けました。</p>
    <p>ご報告ありがとうございました。</p>
    <a href="https://yuichi-takasu.github.io/incident-report/" class="back-btn">新しい報告を入力する</a>
  </div>
</body>
</html>
